<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
<!--the board being cashed in: outer cells fading as the burst reaches them-->
  <g fill="#ffd23f" fill-opacity="0.28">
    <rect x="24" y="24" width="48" height="48" rx="12"/>
    <rect x="184" y="24" width="48" height="48" rx="12"/>
    <rect x="24" y="184" width="48" height="48" rx="12"/>
    <rect x="184" y="184" width="48" height="48" rx="12"/>
  </g>
<!--burst rays-->
  <g stroke="#ffd23f" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <line x1="128" y1="16"  x2="128" y2="60"/>
    <line x1="128" y1="196" x2="128" y2="240"/>
    <line x1="16"  y1="128" x2="60"  y2="128"/>
    <line x1="196" y1="128" x2="240" y2="128"/>
    <line x1="48"  y1="48"  x2="80"  y2="80"/>
    <line x1="176" y1="176" x2="208" y2="208"/>
    <line x1="208" y1="48"  x2="176" y2="80"/>
    <line x1="80"  y1="176" x2="48"  y2="208"/>
  </g>
<!--perfect core-->
  <circle cx="128" cy="128" r="44" fill="#ffd23f" fill-opacity="0.22"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#ffffff" stroke-width="16" filter="url(#glow)"/>
</svg>
