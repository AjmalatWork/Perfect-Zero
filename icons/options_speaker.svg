        fill="#22d3ff" fill-opacity="0.16"/>
  <path d="M60,104 L100,104 L162,58 L162,198 L100,152 L60,152 Z"
        fill="none" stroke="#22d3ff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M188,92 A42,36 0 0,1 188,164" fill="none" stroke="#22d3ff"
        stroke-width="12" stroke-linecap="round"/>
  <path d="M188,64 A72,64 0 0,1 188,192" fill="none" stroke="#22d3ff"
        stroke-width="12" stroke-linecap="round"/>
