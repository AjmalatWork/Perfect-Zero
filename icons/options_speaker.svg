<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!--speaker cone plus two sound-wave arcs, same house style as icons/title_*.svg -
    translucent accent fill/stroke pass then a bold solid pass, no <text>
    elements and no feGaussianBlur/feMerge filter (thorvg does not composite
    those into a soft halo - it blurs the whole shape instead).-->
