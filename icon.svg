<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!--panel. No glow filter - Godot's runtime SVG rasterizer (thorvg) doesn't
    composite feGaussianBlur/feMerge the way a browser does; it blurs the
    whole composite rather than adding a soft halo behind a crisp shape.-->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#0b0d16"/>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="none" stroke="#22d3ff" stroke-width="4"/>
<!--"0.00", drawn as vector ring digits + a dot rather than <text> - thorvg
    doesn't render <text> elements at all, confirmed this session when a
    text-based icon came out blank in-game. Same geometry as the Android
    launcher icons (icons/android_icon_*.svg), scaled to this 128 canvas.
    Rings sized ~15% larger than the original pass, per feedback.-->
  <path fill-rule="evenodd" stroke="#22d3ff" stroke-width="1.3" fill="#ffffff"
        d="M14,64 A12,15 0 1,0 38,64 A12,15 0 1,0 14,64 Z
           M20,64 A6,10 0 1,0 32,64 A6,10 0 1,0 20,64 Z"/>
  <circle cx="49" cy="74" r="3.5" fill="#ffffff" stroke="#22d3ff" stroke-width="1.3"/>
  <path fill-rule="evenodd" stroke="#22d3ff" stroke-width="1.3" fill="#ffffff"
        d="M60,64 A12,15 0 1,0 84,64 A12,15 0 1,0 60,64 Z
           M66,64 A6,10 0 1,0 78,64 A6,10 0 1,0 66,64 Z"/>
  <path fill-rule="evenodd" stroke="#22d3ff" stroke-width="1.3" fill="#ffffff"
        d="M90,64 A12,15 0 1,0 114,64 A12,15 0 1,0 90,64 Z
           M96,64 A6,10 0 1,0 108,64 A6,10 0 1,0 96,64 Z"/>
</svg>
