<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
<!--panel-->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#0b0d16"/>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="none" stroke="#22d3ff" stroke-width="4" filter="url(#glow)"/>
<!--"0.00"-->
  <text x="64" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="42" fill="#ffffff" stroke="#22d3ff" stroke-width="2.5" paint-order="stroke" filter="url(#glow)">0.00</text>
</svg>
